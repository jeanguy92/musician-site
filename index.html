<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Producer & Composer</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --accent: #1db954; --text: #fff; --sub: #b3b3b3; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; }
    h1 { margin: 0; font-size: 2.5rem; }
    p.bio { color: var(--sub); font-size: 1.1rem; max-width: 600px; margin: 0.5rem auto 0; }
    .section-title { border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-top: 2.5rem; }
    .track-card { background: var(--card); border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .track-info h3 { margin: 0 0 0.25rem 0; font-size: 1.1rem; }
    .track-info span { color: var(--sub); font-size: 0.9rem; }
    audio { outline: none; height: 35px; }
    .contact { text-align: center; margin-top: 4rem; color: var(--sub); }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>YOUR NAME</h1>
      <p class="bio">Music Producer & Sound Designer based in Los Angeles. Specializing in cinematic electronic and ambient soundscapes.</p>
    </header>

    <h2 class="section-title">Selected Audio Work</h2>

    <!-- Track 1: Self-hosted MP3 -->
    <div class="track-card">
      <div class="track-info">
        <h3>Midnight Echoes</h3>
        <span>Original Composition • Ambient / Synthwave</span>
      </div>
      <audio controls src="audio/track1.mp3"></audio>
    </div>

    <!-- Track 2: Spotify or SoundCloud Embed alternative -->
    <h2 class="section-title">Featured Releases</h2>
    <div style="margin-top: 1rem;">
      <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/4cOdK2wGChB1R9S3s22222?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <div class="contact">
      <h2>Let's Work Together</h2>
      <p>Inquiries: <a href="mailto:yourname@email.com">yourname@email.com</a></p>
    </div>
  </div>
</body>
</html>
